<!DOCTYPE html>
<html>
<head>
<title>Quota Log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="hamburger" onclick="toggleMenu()">☰</div>
</header>

<nav id="menu">
  <a href="route-request.html">Route Request</a>
  <a href="quota-log.html">Quota Log</a>
</nav>

<div class="container">
<h2>🚌 Route Log</h2>

<input id="discord" placeholder="Discord Username">
<input id="roblox" placeholder="Roblox Username">

<input id="date" type="date">
<input id="start" placeholder="Start Time">
<input id="end" placeholder="End Time">

<input id="type" placeholder="Type of Route">

<textarea id="notes" placeholder="Notes"></textarea>
<input id="proof" placeholder="Proof (DM / Image / Link)">

<button onclick="submitLog()">Submit Log</button>
</div>

<script src="script.js"></script>
<script>
const QUOTA_LOG_URL = "https://script.google.com/macros/s/AKfycbwqHmfXdpTz1dser3HMcSHdfQPAdWoq39NdikAZGuncGjm9Sk44KFeNzB-uMSneOuY/exec";

function submitLog() {
  fetch(QUOTA_LOG_URL, {
    method: "POST",
    body: JSON.stringify([
      new Date(),
      discord.value,
      roblox.value,
      date.value,
      start.value,
      end.value,
      type.value,
      notes.value,
      proof.value
    ])
  }).then(() => alert("Route logged ✅"));
}
</script>

</body>
</html>
